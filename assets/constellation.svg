<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Constelación de Libra">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#dfe8ff" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#aebfff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- estrellitas de fondo -->
  <g fill="#ffffff" opacity=".5">
    <circle cx="30" cy="40" r="1.2"/><circle cx="70" cy="250" r="1"/>
    <circle cx="350" cy="60" r="1.3"/><circle cx="330" cy="270" r="1"/>
    <circle cx="200" cy="160" r=".9"/><circle cx="120" cy="60" r="1"/>
    <circle cx="280" cy="120" r=".9"/><circle cx="45" cy="150" r="1"/>
  </g>

  <!-- líneas de la balanza -->
  <g stroke="#cdd9ff" stroke-width="1.4" opacity=".85" filter="url(#soft)">
    <line x1="200" y1="42" x2="92" y2="122"/>
    <line x1="200" y1="42" x2="308" y2="132"/>
    <line x1="92" y1="122" x2="152" y2="232"/>
    <line x1="308" y1="132" x2="258" y2="242"/>
    <line x1="152" y1="232" x2="258" y2="242"/>
    <line x1="92" y1="122" x2="308" y2="132" opacity=".35"/>
  </g>

  <!-- halos -->
  <g fill="url(#starGlow)">
    <circle cx="200" cy="42" r="22"/>
    <circle cx="92" cy="122" r="16"/>
    <circle cx="308" cy="132" r="16"/>
    <circle cx="152" cy="232" r="13"/>
    <circle cx="258" cy="242" r="13"/>
  </g>

  <!-- núcleos -->
  <g fill="#ffffff" filter="url(#soft)">
    <circle cx="200" cy="42" r="5"/>
    <circle cx="92" cy="122" r="3.6"/>
    <circle cx="308" cy="132" r="3.6"/>
    <circle cx="152" cy="232" r="2.8"/>
    <circle cx="258" cy="242" r="2.8"/>
  </g>
</svg>

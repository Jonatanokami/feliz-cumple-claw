<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#070714" />
  <title>Feliz cumpleaños</title>
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://jonatanokami.github.io/feliz-cumple-claw/" />
  <meta property="og:title" content="Feliz cumpleaños 🎁" />
  <meta property="og:description" content="Tocá para abrir tu sorpresa ✨" />
  <meta property="og:image" content="https://jonatanokami.github.io/feliz-cumple-claw/assets/friend.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>" />
  <link rel="stylesheet" href="style.css?v=22" />
</head>

<body>

  <div id="intro" class="intro">
    <div class="intro-inner">
      <div class="intro-stars" aria-hidden="true"></div>
      <p class="intro-emoji">✨</p>
      <h1 class="intro-title">Tengo una sorpresa<br />para vos</h1>
      <button id="openBtn" class="open-btn" type="button">
        <span class="open-btn-label">ABRIR</span>
      </button>
      <p class="intro-sub">tocá para abrir</p>
    </div>
  </div>

  <div id="hint" class="hint" aria-live="polite"></div>

  <div id="rotateBlock" class="rotate-block" aria-hidden="true">
    <div class="rotate-inner">
      <p class="rotate-emoji">📱</p>
      <p class="rotate-text">Giralo a vertical<br />para ver tu sorpresa ✨</p>
    </div>
  </div>

  <main class="stage" id="stage">
    <div class="scene" id="scene">
      <div class="flip-inner" id="flipInner">

        <div class="face face-front">

          <div class="layer layer-galaxy" data-depth="0.12" aria-hidden="true">
            <div class="galaxy-gradient"></div>

            <img class="galaxy-img" src="assets/galaxy.jpg" alt="" onerror="this.remove()" />
            <div class="nebula nebula-a"></div>
            <div class="nebula nebula-b"></div>
          </div>

          <div class="layer layer-stars" data-depth="0.28" aria-hidden="true">
            <img class="stars-img" src="assets/stars.png" alt="" onerror="this.remove()" />
            <div id="starField" class="star-field"></div>
          </div>

          <div class="layer layer-constellation" data-depth="0.45" aria-hidden="true">
            <div class="constellation-wrap">

              <img class="constellation-img" src="assets/constellation.svg" alt="Constelación de Libra"
                onerror="this.style.display='none'" />
            </div>
          </div>

          <div class="layer layer-photo" data-depth="0.75">
            <div class="photo-halo" aria-hidden="true"></div>
            <div class="photo-frame">

              <img id="friendImg" class="photo-img" src="assets/friend.png" alt="Ella" />
              <div id="photoPlaceholder" class="photo-placeholder" aria-hidden="true">
                <span class="photo-placeholder-emoji">✨</span>
                <span class="photo-placeholder-text">tu foto aquí<br /><small>assets/friend.png</small></span>
              </div>
            </div>
          </div>

          <div class="layer layer-foreground" data-depth="0.95" aria-hidden="true">
            <img class="foreground-img" src="assets/foreground-stars.png" alt="" onerror="this.remove()" />
            <div id="foregroundField" class="foreground-field"></div>
          </div>

          <div class="layer layer-text" data-depth="0.20">
            <div class="text-card">
              <h2 id="birthdayTitle" class="birthday-title">Feliz cumpleaños</h2>
              <p id="birthdaySubtitle" class="birthday-subtitle">Te deseo un muy lindo dia y que todos tus sueños se
                hagan realidad ✨</p>
            </div>
          </div>

        </div>

        <div class="face face-back">
          <div class="layer back-bg" data-depth="0.12" aria-hidden="true">
            <div class="back-gradient"></div>
            <div class="nebula nebula-a"></div>
            <div id="backStarField" class="star-field"></div>
          </div>
          <div class="layer back-content" data-depth="0.20">
            <div class="back-card">

              <div id="backPhotoWrap" class="back-photo-wrap hidden" aria-hidden="true">
                <img id="backImg" class="back-photo" src="assets/back-photo.png" alt="" />
              </div>
              <h3 id="backTitle" class="back-title">Claw ❤️</h3>
              <p id="backMessage" class="back-message"></p>
              <p class="back-sign">Jonatan</p>
            </div>
          </div>
        </div>

      </div>

      <div class="vignette" aria-hidden="true"></div>
      <div class="card-frame" aria-hidden="true"></div>

    </div>
  </main>

  <audio id="bgMusic" src="assets/music.mp3" loop preload="auto"></audio>
  <div class="music-wrap" id="musicWrap">
    <div class="volume-pop" id="volumePop" aria-hidden="true">
      <button id="muteBtn" class="mute-btn" type="button" aria-label="Silenciar música">🔊</button>
      <input id="volumeSlider" class="volume-slider" type="range" min="0" max="100" value="35"
        step="1" aria-label="Volumen de la música" />
    </div>
    <button id="musicBtn" class="music-btn" type="button" aria-label="Volumen" aria-expanded="false">🔊</button>
  </div>
  <button id="flipBtn" class="flip-btn" type="button" aria-label="Leer mensaje">❤️</button>
  <button id="backBtn" class="back-btn" type="button">volver</button>

  <div id="videoOverlay" class="video-overlay" aria-hidden="true">
    <video id="backVideo" class="back-video" src="assets/video.mp4" playsinline muted
      preload="metadata" disablepictureinpicture></video>
    <button id="videoClose" class="video-close" type="button" aria-label="Cerrar video">✕</button>
  </div>

  <script src="script.js?v=22"></script>
</body>

</html>
